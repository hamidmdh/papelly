name: Build Papely APK

on:
  push:
    branches: [main]
    paths:
      - "papely/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages (preinstalled SDK, no setup-android action)
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --project-dir papely --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: papely-debug-apk
          path: papely/app/build/outputs/apk/debug/app-debug.apk
